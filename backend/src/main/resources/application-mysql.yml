# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Expects the etfdb_dev database (etfdb_dev.sql) plus db/mysql/app_additions.sql.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/etfdb_dev}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
